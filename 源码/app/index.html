<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>桌面提醒</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>桌面提醒</div>
  </header>

  <main class="layout">
    <!-- 左：写内容 -->
    <section class="sheet" aria-label="编辑提醒">
      <div class="field">
        <label for="title">标题</label>
        <input id="title" type="text" placeholder="比如：这周要做的事" autocomplete="off">
      </div>

      <div class="field field-grow">
        <div class="field-head">
          <label for="text">提醒内容</label>
          <span class="hint">一行一条，行首写 - 或 1. 会排成列表</span>
        </div>
        <textarea id="text" spellcheck="false" placeholder="- 周五前交报告&#10;- 给妈妈打电话"></textarea>
      </div>

      <div class="style-block">
        <div class="row">
          <span class="row-label">字体</span>
          <button id="fontBtn" class="font-pick" type="button">
            <span id="fontName" class="font-pick-name">系统默认</span>
            <span class="font-pick-action">字体库</span>
          </button>
        </div>

        <div class="row row-top">
          <span class="row-label">位置</span>
          <div class="pos-wrap">
            <div class="pos-screen" id="posGrid" role="radiogroup" aria-label="提醒在桌面上的位置"></div>
            <span class="pos-caption" id="posCaption">右上角</span>
          </div>
        </div>

        <div class="row">
          <label class="row-label" for="size">文字大小</label>
          <input id="size" type="range" min="18" max="64" step="1">
          <output id="sizeOut" for="size" class="num">32</output>
        </div>

        <div class="row">
          <span class="row-label">面板</span>
          <div class="seg" id="panelSeg" role="radiogroup" aria-label="面板样式">
            <button type="button" data-v="dark" role="radio">深色玻璃</button>
            <button type="button" data-v="light" role="radio">浅色玻璃</button>
            <button type="button" data-v="clear" role="radio">只有文字</button>
          </div>
        </div>

        <div class="row" id="opacityRow">
          <label class="row-label" for="opacity">面板浓度</label>
          <input id="opacity" type="range" min="0.1" max="0.9" step="0.01">
          <output id="opacityOut" class="num">55%</output>
        </div>
      </div>
    </section>

    <!-- 右：桌面预览 -->
    <section class="stage" aria-label="预览">
      <div class="monitor-wrap" id="monitorWrap">
        <div class="monitor" id="monitor">
          <canvas id="preview" aria-label="壁纸预览"></canvas>
        </div>
      </div>

      <div class="bg-bar">
        <span class="row-label">背景</span>
        <div class="swatches" id="swatches" role="radiogroup" aria-label="背景"></div>
      </div>

      <footer class="actions">
        <label class="toggle"><input type="checkbox" id="showDate"><span class="toggle-ui" aria-hidden="true"></span>显示日期</label>
        <label class="toggle"><input type="checkbox" id="login"><span class="toggle-ui" aria-hidden="true"></span>开机自动启动</label>
        <div class="spacer"></div>
        <button id="restore" class="btn-text" type="button" hidden>恢复原壁纸</button>
        <span id="status" class="status" role="status"></span>
        <button id="apply" class="btn-primary" type="button">应用到桌面</button>
      </footer>
    </section>
  </main>

  <!-- 字体库 -->
  <div class="drawer-scrim" id="fontScrim" hidden></div>
  <aside class="drawer" id="fontDrawer" aria-label="字体库" hidden>
    <div class="drawer-head">
      <div>
        <h2>字体库</h2>
        <p>点「下载」把字体存到这台电脑上，之后不联网也能用。</p>
      </div>
      <button class="icon-btn" id="fontClose" type="button" aria-label="关闭字体库">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="seg seg-small" id="fontFilter" role="tablist">
      <button type="button" data-v="all" class="on">全部</button>
      <button type="button" data-v="zh">中文字体</button>
      <button type="button" data-v="en">英文字体</button>
    </div>
    <div class="font-grid" id="fontGrid"></div>
  </aside>

  <script src="catalog.js"></script>
  <script src="render.js"></script>
  <script src="app.js"></script>
</body>
</html>
