<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>桌面提醒</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="#3D4BD1"/><path d="M6 10.4l2.6 2.6L14 7.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>桌面提醒</div>
  </header>

  <main class="layout">
    <!-- 左：写内容 -->
    <section class="sheet" aria-label="编辑提醒">
      <div class="seg tabs" id="tabs" role="tablist">
        <button type="button" role="tab" data-t="content" aria-selected="true" class="on">内容</button>
        <button type="button" role="tab" data-t="style" aria-selected="false">外观</button>
      </div>

      <div class="pane" id="paneContent">
        <div class="field">
          <label for="title">标题</label>
          <input id="title" type="text" placeholder="比如：这周要做的事" autocomplete="off">
        </div>

        <div class="today" aria-label="今天的安排">
          <div class="today-head">
            <h3>今天 <span id="todayDate" class="hint"></span></h3>
            <span id="todayProgress" class="todo-info"></span>
            <button id="todayClear" class="btn-text" type="button" hidden>清除已完成</button>
          </div>
          <form class="add-form" id="addForm" autocomplete="off">
            <input id="addInput" type="text" placeholder="添加一条，回车就好" maxlength="200" aria-label="添加一条待办或提醒">
            <button id="addKind" class="chip" type="button" data-v="todo" title="点一下切换。待办：没做完会自动顺延、标逾期；提醒：只在当天显示，不逾期">待办</button>
            <select id="addRepeat" class="chip rep-select" aria-label="重复" title="重复：每天 / 工作日 / 每周 / 每月。重复的提醒和待办不会逾期">
              <option value="none">不重复</option><option value="daily">每天</option><option value="weekdays">工作日</option>
              <option value="w1">每周一</option><option value="w2">每周二</option><option value="w3">每周三</option><option value="w4">每周四</option><option value="w5">每周五</option><option value="w6">每周六</option><option value="w0">每周日</option>
              <option value="monthly">每月同一天</option>
            </select>
            <button id="calOpen" class="chip cal-chip" type="button" title="打开日历：提前写以后某一天的待办或提醒">
              <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="3" y="4.5" width="14" height="12.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 8.5h14M7 3v3M13 3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              日历
            </button>
            <button class="btn-primary add-btn" type="submit" aria-label="添加">添加</button>
          </form>
          <div class="hint today-hint" id="todayHint" hidden>拖动手柄排先后（越靠前越重要）· 点 ☆ 标重要</div>
          <ul class="today-list" id="todayList"></ul>
        </div>

      </div>

      <div class="pane" id="paneStyle" hidden>
      <div class="bg-bar">
        <span class="row-label">背景</span>
        <div class="swatches" id="swatches" role="radiogroup" aria-label="背景"></div>
      </div>

      <div class="rotate-bar" id="rotateBar" hidden>
        <span class="row-label">轮换</span>
        <span class="rotate-folder" id="rotateFolder"></span>
        <button id="rotateChange" class="btn-text" type="button">更换文件夹</button>
        <label class="rotate-every">每
          <select id="rotateMinutes" aria-label="多久换一张">
            <option value="0">不自动换</option>
            <option value="1">1 分钟</option>
            <option value="5">5 分钟</option>
            <option value="10">10 分钟</option>
            <option value="15">15 分钟</option>
            <option value="30">30 分钟</option>
            <option value="60">1 小时</option>
            <option value="120">2 小时</option>
            <option value="360">6 小时</option>
            <option value="720">12 小时</option>
            <option value="1440">每天</option>
          </select> 换一张
        </label>
        <button id="rotateNow" class="btn-text" type="button">立即换一张</button>
      </div>
      <div class="style-block">
        <div class="row">
          <span class="row-label">字体</span>
          <button id="fontBtn" class="font-pick" type="button">
            <span id="fontName" class="font-pick-name">系统默认</span>
            <span class="font-pick-action">字体库</span>
          </button>
        </div>

        <div class="row row-top">
          <span class="row-label">位置</span>
          <div class="pos-wrap">
            <div class="pos-screen" id="posGrid" role="radiogroup" aria-label="提醒在桌面上的位置"></div>
            <span class="pos-caption" id="posCaption">右上角</span>
          </div>
        </div>

        <div class="row">
          <label class="row-label" for="size">文字大小</label>
          <input id="size" type="range" min="18" max="64" step="1">
          <output id="sizeOut" for="size" class="num">32</output>
        </div>

        <div class="row">
          <span class="row-label">面板</span>
          <div class="seg" id="panelSeg" role="radiogroup" aria-label="面板样式">
            <button type="button" data-v="dark" role="radio">深色玻璃</button>
            <button type="button" data-v="light" role="radio">浅色玻璃</button>
            <button type="button" data-v="clear" role="radio">只有文字</button>
          </div>
        </div>

        <div class="row" id="opacityRow">
          <label class="row-label" for="opacity">面板浓度</label>
          <input id="opacity" type="range" min="0.1" max="0.9" step="0.01">
          <output id="opacityOut" class="num">55%</output>
        </div>
      </div>
      </div>
      <div class="sheet-foot">
        <span id="appVersion" class="hint"></span>
        <button id="checkUpdateBtn" class="btn-text" type="button" title="对比 GitHub 上的最新版本；有新版会询问你是否下载并安装">检查更新</button>
      </div>
    </section>

    <!-- 右：桌面预览 -->
    <section class="stage" aria-label="预览">
      <div class="monitor-wrap" id="monitorWrap">
        <div class="monitor" id="monitor">
          <canvas id="preview" aria-label="壁纸预览"></canvas>
        </div>
      </div>

      <footer class="actions">
        <label class="toggle"><input type="checkbox" id="showDate"><span class="toggle-ui" aria-hidden="true"></span>显示日期</label>
        <label class="toggle"><input type="checkbox" id="login"><span class="toggle-ui" aria-hidden="true"></span>开机自动启动</label>
        <div class="spacer"></div>
        <button id="restore" class="btn-text" type="button" hidden>恢复原壁纸</button>
        <span id="status" class="status" role="status"></span>
        <button id="apply" class="btn-primary" type="button">应用到桌面</button>
      </footer>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden>
    <span id="toastMsg"></span>
    <button id="toastAct" class="btn-text" type="button"></button>
  </div>

  <!-- 日历提醒 -->
  <div class="drawer-scrim" id="calScrim" hidden></div>
  <section class="cal" id="cal" aria-label="日历提醒" hidden>
    <div class="cal-top">
      <div>
        <h2>日历提醒</h2>
        <p>提前写好某一天的提醒或待办，到那一天才会出现在桌面上；待办还可以设截止日，倒计时会显示在卡片上。</p>
      </div>
      <button class="icon-btn" id="calClose" type="button" aria-label="关闭日历">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="cal-body">
      <div class="cal-left">
        <div class="cal-nav">
          <button id="calPrev" class="icon-btn" type="button" aria-label="上个月">‹</button>
          <strong id="calTitle" class="cal-title"></strong>
          <button id="calNext" class="icon-btn" type="button" aria-label="下个月">›</button>
          <button id="calToday" class="btn-text" type="button">回到今天</button>
        </div>
        <div class="cal-week" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
        <div class="cal-grid" id="calGrid" role="grid" aria-label="月历"></div>
        <div class="cal-legend"><i class="dot dot-todo"></i>待办 <i class="dot dot-todo all-done"></i>待办已全部完成 <i class="dot dot-note"></i>提醒 <i class="dot dot-due"></i>待办的截止日</div>
      </div>
      <aside class="cal-right" aria-label="选中日期的安排">
        <h3 id="calDayTitle"></h3>
        <ul class="cal-list" id="calList"></ul>
        <form class="cal-form" id="calForm" autocomplete="off">
          <input id="calInput" type="text" placeholder="写点什么，回车添加" maxlength="200" aria-label="内容">
          <div class="cal-form-row">
            <div class="seg seg-small" id="calKind" role="radiogroup" aria-label="类型">
              <button type="button" data-v="todo" role="radio" aria-checked="true">待办</button>
              <button type="button" data-v="note" role="radio" aria-checked="false">提醒</button>
            </div>
            <select id="calRepeat" class="chip rep-select cal-rep" aria-label="重复" title="重复：每天 / 工作日 / 每周 / 每月。重复的提醒和待办不会逾期">
              <option value="none">不重复</option><option value="daily">每天</option><option value="weekdays">工作日</option>
              <option value="w1">每周一</option><option value="w2">每周二</option><option value="w3">每周三</option><option value="w4">每周四</option><option value="w5">每周五</option><option value="w6">每周六</option><option value="w0">每周日</option>
              <option value="monthly">每月同一天</option>
            </select>
          </div>
          <div class="cal-form-row">
            <label class="due-field" for="calDue" title="截止日（可选）：用来倒计时，到了还没做完会标「已逾期 N 天」">截止日 <input id="calDue" type="date" aria-label="截止日"></label>
            <button class="btn-primary cal-add" type="submit">添加</button>
          </div>
          <div class="hint cal-form-hint" id="calFormHint"></div>
        </form>
      </aside>
    </div>
  </section>

  <!-- 字体库 -->
  <div class="drawer-scrim" id="fontScrim" hidden></div>
  <aside class="drawer" id="fontDrawer" aria-label="字体库" hidden>
    <div class="drawer-head">
      <div>
        <h2>字体库</h2>
        <p>点「下载」把字体存到这台电脑上，之后不联网也能用。</p>
      </div>
      <button class="icon-btn" id="fontClose" type="button" aria-label="关闭字体库">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="seg seg-small" id="fontFilter" role="tablist">
      <button type="button" data-v="all" class="on">全部</button>
      <button type="button" data-v="zh">中文字体</button>
      <button type="button" data-v="en">英文字体</button>
    </div>
    <div class="font-grid" id="fontGrid"></div>
  </aside>

  <script src="catalog.js"></script>
  <script src="render.js"></script>
  <script src="calendar.js"></script>
  <script src="app.js"></script>
</body>
</html>
