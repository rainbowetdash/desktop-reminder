<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>更新桌面提醒</title>
<style>
:root{--bg:#EEF0F5;--surface:#fff;--ink:#1B1E2E;--ink2:#5D6378;--ink3:#8E93A6;--line:#DDE1EA;--accent:#3D4BD1;--ok:#24855A;--danger:#C2412D;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#13151D;--surface:#1B1E29;--ink:#E9EBF3;--ink2:#A3A8BB;--ink3:#737A90;--line:#2C3142;--accent:#8C96FF;--ok:#6FD3A2;--danger:#FF8A73;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei UI","Microsoft YaHei",sans-serif;-webkit-user-select:none;user-select:none}
main{padding:26px 28px 22px;display:flex;flex-direction:column;gap:14px;height:100%}
.head{display:flex;align-items:center;gap:12px}
.logo{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px}
h1{font-size:17px;margin:0;font-weight:700}
.sub{color:var(--ink2);font-size:12.5px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}
.bar.indet>i{width:35%;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stage{font-weight:600}
.num{color:var(--ink2);font-variant-numeric:tabular-nums;font-size:12.5px}
.steps{display:flex;gap:6px;font-size:12px;color:var(--ink3)}
.steps span{flex:1;text-align:center;padding:4px 0;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.steps span.on{color:var(--accent);border-color:var(--accent);font-weight:600}
.steps span.done{color:var(--ok)}
.foot{margin-top:auto;display:flex;justify-content:flex-end;gap:8px}
button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 16px;font:inherit;cursor:pointer}
button:hover{border-color:var(--ink3)}
button[hidden]{display:none}
.err{color:var(--danger)}
</style>
</head>
<body>
<main>
  <div class="head">
    <div class="logo"><svg viewBox="0 0 20 20"><path d="M5.5 10.4l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div><h1 id="title">正在更新桌面提醒</h1><div class="sub" id="sub"></div></div>
  </div>
  <div class="steps" id="steps"><span data-s="download">下载</span><span data-s="verify">校验</span><span data-s="install">安装</span><span data-s="restart">重启</span></div>
  <div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="row" style="margin-top:8px"><span class="stage" id="stage">准备中…</span><span class="num" id="pct"></span></div>
    <div class="num" id="detail"></div>
  </div>
  <div class="foot"><button id="cancel" type="button">取消更新</button></div>
</main>
<script>
const $=(id)=>document.getElementById(id);
const ORDER=['download','verify','install','restart'];
const LABEL={download:'正在下载…',verify:'正在校验文件…',install:'正在安装…',restart:'即将重启，请稍候…',error:'更新没有成功'};
const mb=(n)=>(n/1048576).toFixed(1);
upd.onState((s)=>{
  $('title').textContent = s.stage==='error' ? '更新没有成功' : '正在更新到 '+s.version;
  $('sub').textContent = s.from ? '从 '+s.from+' 升级，来源：GitHub' : '';
  const idx = ORDER.indexOf(s.stage);
  for (const el of $('steps').children){ const i=ORDER.indexOf(el.dataset.s); el.className = i<idx ? 'done' : i===idx ? 'on' : ''; }
  $('stage').textContent = LABEL[s.stage]||'';
  $('stage').className = 'stage' + (s.stage==='error'?' err':'');
  const bar=$('bar');
  if (s.stage==='download' && s.total){ bar.className='bar'; $('fill').style.width=Math.min(100,s.got/s.total*100)+'%'; $('pct').textContent=Math.floor(s.got/s.total*100)+'%';
    const left = s.speed>0 ? Math.max(0,Math.ceil((s.total-s.got)/s.speed)) : null;
    $('detail').textContent = mb(s.got)+' / '+mb(s.total)+' MB' + (s.speed? '  ·  '+mb(s.speed)+' MB/s' : '') + (left!==null? '  ·  还需约 '+(left>=60? Math.ceil(left/60)+' 分钟' : left+' 秒') : '');
  } else if (s.stage==='error'){ bar.className='bar'; $('fill').style.width='0'; $('pct').textContent=''; $('detail').textContent=s.message||'';
  } else { bar.className = s.stage==='download' ? 'bar indet' : 'bar'; $('fill').style.width = s.stage==='download' ? '' : '100%'; $('pct').textContent = s.stage==='download' ? '' : '100%'; $('detail').textContent=''; }
  $('cancel').hidden = !(s.stage==='download');
});
$('cancel').addEventListener('click',()=>{ $('cancel').disabled=true; upd.cancel(); });
upd.ready();
</script>
</body>
</html>
